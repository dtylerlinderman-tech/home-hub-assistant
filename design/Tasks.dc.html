<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen Hub – Kids' tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}a{color:#E8A33D}a:hover{color:#F2C27A}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #1B1A17; color: #F4EFE6; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

<nav aria-label="Main" style="width: 104px; flex-shrink: 0; box-sizing: border-box; padding: 28px 0; background: #141310; border-right: 1px solid #2E2B26; display: flex; flex-direction: column; align-items: center; gap: 10px">
<a href="Main.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>Home</span></a>
<a href="Calendar.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span>Calendar</span></a>
<a href="Meals.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v6a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.2 0-3.5 2.5-3.5 6v4H17"></path></svg><span>Meals</span></a>
<a href="Recipes.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5M8 7h7"></path></svg><span>Recipes</span></a>
<a href="Tasks.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 700; background: #312E28; color: #F4EFE6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #E8A33D"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="m8 9 2 2 4-4M8 16h8"></path></svg><span>Tasks</span></a>
<a href="Climate.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path><path d="M12 9v8"></path></svg><span>Climate</span></a>
<a href="TV.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 18v3"></path></svg><span>TV</span></a>
<div style="flex: 1"></div>
<a href="Door.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5FB3A6"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Door</span></a>
</nav>

<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; justify-content: space-between; align-items: center; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em">Tasks</span>
<span style="font-size: 17px; color: #A8A196">{{today}} · Lists reset every morning</span>
</div>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
<section aria-label="{{k.aria}}" style="background: #26241F; border: 1px solid #2E2B26; border-radius: 28px; padding: 24px 26px; display: flex; flex-direction: column; gap: 16px; min-height: 0">
<div style="display: flex; align-items: center; gap: 16px">
<span style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 30px; background: {{k.color}}; color: #1B1A17; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{k.initial}}</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 32px; font-weight: 800; letter-spacing: -0.01em">{{k.name}}</span>
<span style="font-size: 17px; font-weight: 700; color: #D6D0C4">{{k.progressText}}</span>
</div>
<span style="height: 12px; border-radius: 6px; background: #3A362F; display: flex; overflow: hidden"><span style="width: {{k.pct}}%; height: 100%; border-radius: 6px; background: {{k.color}}"></span></span>
</div>
</div>

<sc-if value="{{k.allDone}}" hint-placeholder-val="{{ false }}">
<div style="border-radius: 18px; background: {{k.tint}}; padding: 14px 18px; display: flex; align-items: center; gap: 12px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="{{k.color}}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"></path></svg>
<span style="font-size: 20px; font-weight: 800">All done today, {{k.name}}!</span>
</div>
</sc-if>

<sc-for list="{{k.sections}}" as="sec" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #A8A196; padding-top: 2px">{{sec.label}}</span>
<sc-for list="{{sec.tasks}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="all: unset; cursor: pointer; min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: {{t.bg}}; display: flex; align-items: center; gap: 16px">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 11px; box-sizing: border-box; border: 2.5px solid {{t.ring}}; background: {{t.fill}}; color: #1B1A17; display: flex; align-items: center; justify-content: center"><sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if></span>
<span style="font-size: 21px; font-weight: 700; color: {{t.color}}; text-decoration: {{t.strike}}">{{t.label}}</span>
</button>
</sc-for>
</div>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.kids = [
      { id: 'max', name: 'Max', color: '#6EA8E8', tint: '#1C2A3A', sections: [
        { label: 'Morning', tasks: ['Make your bed', 'Brush teeth', 'Get dressed'] },
        { label: 'After school', tasks: ['Unpack backpack', 'Read for 20 minutes', 'Pick up your room'] }
      ] },
      { id: 'lily', name: 'Lily', color: '#B79CF0', tint: '#2A2238', sections: [
        { label: 'Morning', tasks: ['Brush teeth', 'Get dressed', 'Shoes by the door'] },
        { label: 'Evening', tasks: ['Clear your plate', 'Pick up toys', 'Bath & pajamas'] }
      ] }
    ];
    this.state = { done: { 'max-0-0': true, 'max-0-1': true, 'lily-0-0': true } };
  }
  renderVals() {
    const done = this.state.done;
    const kids = this.kids.map((k) => {
      let total = 0;
      let count = 0;
      const sections = k.sections.map((sec, si) => ({
        label: sec.label,
        tasks: sec.tasks.map((label, ti) => {
          const key = k.id + '-' + si + '-' + ti;
          const d = !!done[key];
          total += 1;
          if (d) count += 1;
          return {
            label,
            done: d,
            pressed: d ? 'true' : 'false',
            bg: d ? '#2A2823' : '#312E28',
            ring: d ? k.color : '#6B665C',
            fill: d ? k.color : 'transparent',
            color: d ? '#8C867B' : '#F4EFE6',
            strike: d ? 'line-through' : 'none',
            toggle: () => this.setState({ done: { ...this.state.done, [key]: !d } })
          };
        })
      }));
      return {
        name: k.name,
        aria: k.name + "'s tasks",
        initial: k.name.charAt(0),
        color: k.color,
        tint: k.tint,
        sections,
        progressText: count + ' of ' + total + ' done',
        pct: Math.round((count / total) * 100),
        allDone: count === total
      };
    });
    return {
      kids,
      today: new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
    };
  }
}
</script>
</body>
</html>
