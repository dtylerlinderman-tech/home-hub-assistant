<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen Hub – Recipes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}a{color:#E8A33D}a:hover{color:#F2C27A}input::placeholder{color:#8C867B}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #1B1A17; color: #F4EFE6; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

<nav aria-label="Main" style="width: 104px; flex-shrink: 0; box-sizing: border-box; padding: 28px 0; background: #141310; border-right: 1px solid #2E2B26; display: flex; flex-direction: column; align-items: center; gap: 10px">
<a href="Main.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>Home</span></a>
<a href="Calendar.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span>Calendar</span></a>
<a href="Meals.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v6a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.2 0-3.5 2.5-3.5 6v4H17"></path></svg><span>Meals</span></a>
<a href="Recipes.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 700; background: #312E28; color: #F4EFE6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #E8A33D"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5M8 7h7"></path></svg><span>Recipes</span></a>
<a href="Tasks.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="m8 9 2 2 4-4M8 16h8"></path></svg><span>Tasks</span></a>
<a href="Climate.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path><path d="M12 9v8"></path></svg><span>Climate</span></a>
<a href="TV.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 18v3"></path></svg><span>TV</span></a>
<div style="flex: 1"></div>
<a href="Door.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5FB3A6"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Door</span></a>
</nav>

<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; align-items: center; gap: 16px">
<span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em; margin-right: 8px">Recipes</span>
<label style="flex: 1; height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; background: #26241F; border: 1px solid #3A362F; display: flex; align-items: center; gap: 12px; color: #A8A196">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search recipes</span>
<input type="search" value="{{query}}" onChange="{{onSearch}}" placeholder="Search recipes" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #F4EFE6; font-family: inherit; font-size: 18px; font-weight: 500">
</label>
<button type="button" onClick="{{toggleImport}}" style="all: unset; cursor: pointer; height: 56px; padding: 0 22px; border-radius: 18px; background: #E8A33D; color: #1B1A17; font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add from a link</button>
</header>

<sc-if value="{{showImport}}" hint-placeholder-val="{{ false }}">
<div style="background: #26241F; border: 1px solid #3A362F; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
<label style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: #A8A196">Paste a recipe link from any site. Ingredients and steps are pulled in automatically.</span>
<input type="url" placeholder="https://" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #1B1A17; border: 1px solid #3A362F; color: #F4EFE6; font-family: inherit; font-size: 17px; outline: none">
</label>
<button type="button" onClick="{{toggleImport}}" style="all: unset; cursor: pointer; height: 52px; padding: 0 22px; border-radius: 16px; background: #312E28; font-size: 16px; font-weight: 800; display: flex; align-items: center">Import</button>
</div>
</sc-if>

<div role="group" aria-label="Filter by category" style="display: flex; gap: 10px; flex-wrap: wrap">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="all: unset; cursor: pointer; height: 46px; padding: 0 20px; border-radius: 23px; background: {{c.bg}}; color: {{c.fg}}; font-size: 16px; font-weight: 700; display: flex; align-items: center">{{c.label}}</button>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px">
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 60px 0; text-align: center; font-size: 18px; color: #A8A196">No recipes match that search.</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="8">
<a href="Cook.dc.html" style="text-decoration: none; color: #F4EFE6; background: #26241F; border: 1px solid #2E2B26; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<span style="height: 110px; border-radius: 14px; background: {{r.tile}}; display: flex; align-items: center; justify-content: center; color: #8C867B"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v6a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.2 0-3.5 2.5-3.5 6v4H17"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 4px"><span style="font-size: 17px; font-weight: 800; line-height: 1.25">{{r.name}}</span><span style="font-size: 14px; color: #A8A196">{{r.meta}}</span></span>
</a>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.pool = [
      { name: 'Sheet-pan chicken fajitas', mins: 35, tags: ['Weeknight'] },
      { name: 'Spaghetti & meatballs', mins: 40, tags: ['Kids'] },
      { name: 'Grilled salmon & rice', mins: 30, tags: ['Grill'] },
      { name: 'Turkey tacos', mins: 25, tags: ['Weeknight', 'Kids'] },
      { name: 'Chicken stir-fry', mins: 25, tags: ['Weeknight'] },
      { name: 'Burgers & sweet potato fries', mins: 40, tags: ['Grill', 'Kids'] },
      { name: 'Slow cooker pot roast', mins: 480, tags: ['Slow cooker'] },
      { name: 'Homemade pizza night', mins: 45, tags: ['Kids'] },
      { name: 'Lemon herb chicken thighs', mins: 35, tags: ['Weeknight'] },
      { name: 'Steak & roasted veggies', mins: 35, tags: ['Grill'] },
      { name: 'Chili & cornbread', mins: 60, tags: ['Slow cooker'] },
      { name: 'Breakfast for dinner', mins: 20, tags: ['Weeknight', 'Kids'] },
      { name: 'Shrimp fried rice', mins: 25, tags: ['Weeknight'] },
      { name: 'Pulled pork sandwiches', mins: 480, tags: ['Slow cooker'] }
    ];
    this.state = { query: '', cat: 'All', showImport: false };
  }
  renderVals() {
    const s = this.state;
    const tiles = ['#3A2F22', '#2F3326', '#2C2F36', '#36292C'];
    const q = s.query.trim().toLowerCase();
    const recipes = this.pool
      .filter((r) => (s.cat === 'All' || r.tags.indexOf(s.cat) >= 0) && (!q || r.name.toLowerCase().indexOf(q) >= 0))
      .map((r, i) => ({
        name: r.name,
        meta: (r.mins >= 120 ? Math.round(r.mins / 60) + ' hr' : r.mins + ' min') + ' · ' + r.tags.join(' · '),
        tile: tiles[i % tiles.length]
      }));
    const chips = ['All', 'Weeknight', 'Kids', 'Grill', 'Slow cooker'].map((label) => {
      const on = s.cat === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#F4EFE6' : '#26241F',
        fg: on ? '#1B1A17' : '#F4EFE6',
        pick: () => this.setState({ cat: label })
      };
    });
    return {
      query: s.query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      showImport: s.showImport,
      toggleImport: () => this.setState({ showImport: !s.showImport }),
      chips,
      recipes,
      empty: recipes.length === 0
    };
  }
}
</script>
</body>
</html>
