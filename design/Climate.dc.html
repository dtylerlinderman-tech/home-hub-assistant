<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen Hub – Climate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}a{color:#E8A33D}a:hover{color:#F2C27A}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #1B1A17; color: #F4EFE6; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

<nav aria-label="Main" style="width: 104px; flex-shrink: 0; box-sizing: border-box; padding: 28px 0; background: #141310; border-right: 1px solid #2E2B26; display: flex; flex-direction: column; align-items: center; gap: 10px">
<a href="Main.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>Home</span></a>
<a href="Calendar.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span>Calendar</span></a>
<a href="Meals.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v6a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.2 0-3.5 2.5-3.5 6v4H17"></path></svg><span>Meals</span></a>
<a href="Recipes.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5M8 7h7"></path></svg><span>Recipes</span></a>
<a href="Tasks.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="m8 9 2 2 4-4M8 16h8"></path></svg><span>Tasks</span></a>
<a href="Climate.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 700; background: #312E28; color: #F4EFE6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #E8A33D"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path><path d="M12 9v8"></path></svg><span>Climate</span></a>
<a href="TV.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 18v3"></path></svg><span>TV</span></a>
<div style="flex: 1"></div>
<a href="Door.dc.html" style="width: 80px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; text-decoration: none; font-size: 12px; font-weight: 600; color: #A8A196"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5FB3A6"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Door</span></a>
</nav>

<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; justify-content: space-between; align-items: center; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em">Climate</span>
<span style="font-size: 17px; color: #A8A196">Outside 72° · Sunny · Two ecobee thermostats</span>
</div>
<div role="group" aria-label="Comfort setting for the whole house" style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 14px; font-weight: 700; color: #A8A196; margin-right: 4px">Whole house</span>
<sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="all: unset; cursor: pointer; height: 52px; padding: 0 22px; border-radius: 26px; background: {{p.bg}}; color: {{p.fg}}; font-size: 17px; font-weight: 800; display: flex; align-items: center">{{p.label}}</button>
</sc-for>
</div>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{zones}}" as="z" hint-placeholder-count="2">
<section aria-label="{{z.name}} thermostat" style="background: #26241F; border: 1px solid #2E2B26; border-radius: 28px; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 24px; font-weight: 800">{{z.name}}</span>
<span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; background: {{z.statusBg}}; color: {{z.statusFg}}; font-size: 15px; font-weight: 800"><span style="width: 9px; height: 9px; border-radius: 5px; background: {{z.statusFg}}"></span>{{z.status}}</span>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A8A196">Inside now</span>
<span style="font-size: 112px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">{{z.current}}°</span>
<span style="font-size: 15px; color: #A8A196">Humidity {{z.humidity}}%</span>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" onClick="{{z.down}}" aria-label="{{z.downLabel}}" style="all: unset; cursor: pointer; width: 72px; height: 72px; border-radius: 36px; background: #312E28; display: flex; align-items: center; justify-content: center; color: #6EA8E8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<div style="width: 104px; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A8A196">{{z.setLabel}}</span>
<span style="font-size: 52px; font-weight: 800; line-height: 1.05; color: {{z.setColor}}; font-variant-numeric: tabular-nums">{{z.setText}}</span>
</div>
<button type="button" onClick="{{z.up}}" aria-label="{{z.upLabel}}" style="all: unset; cursor: pointer; width: 72px; height: 72px; border-radius: 36px; background: #312E28; display: flex; align-items: center; justify-content: center; color: #F59A85"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
</div>

<div style="flex: 1"></div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A8A196">Mode</span>
<div role="group" aria-label="{{z.modeGroup}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 6px; border-radius: 18px; background: #1B1A17">
<sc-for list="{{z.modes}}" as="m" hint-placeholder-count="4">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="all: unset; cursor: pointer; height: 52px; border-radius: 14px; background: {{m.bg}}; color: {{m.fg}}; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{m.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 17px; font-weight: 700">Fan</span>
<div role="group" aria-label="{{z.fanGroup}}" style="display: flex; gap: 6px; padding: 6px; border-radius: 16px; background: #1B1A17">
<sc-for list="{{z.fans}}" as="f" hint-placeholder-count="2">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="all: unset; cursor: pointer; height: 44px; padding: 0 22px; border-radius: 12px; background: {{f.bg}}; color: {{f.fg}}; font-size: 16px; font-weight: 800; display: flex; align-items: center">{{f.label}}</button>
</sc-for>
</div>
</div>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      preset: 'Home',
      zones: [
        { name: 'Downstairs', current: 71, humidity: 44, set: 72, mode: 'Cool', fan: 'Auto' },
        { name: 'Upstairs', current: 74, humidity: 47, set: 72, mode: 'Cool', fan: 'Auto' }
      ]
    };
    this.presetTemps = { Home: 72, Away: 78, Sleep: 69 };
  }
  updateZone(i, patch) {
    const zones = this.state.zones.map((z, j) => (j === i ? { ...z, ...patch } : z));
    this.setState({ zones, preset: patch.set !== undefined ? '' : this.state.preset });
  }
  renderVals() {
    const s = this.state;
    const seg = (on) => ({ bg: on ? '#F4EFE6' : 'transparent', fg: on ? '#1B1A17' : '#D6D0C4', pressed: on ? 'true' : 'false' });
    const zones = s.zones.map((z, i) => {
      let status = 'Idle';
      let statusBg = '#312E28';
      let statusFg = '#D6D0C4';
      if (z.mode === 'Off') { status = 'Off'; }
      else if ((z.mode === 'Cool' || z.mode === 'Auto') && z.current > z.set) { status = 'Cooling to ' + z.set + '°'; statusBg = '#1C2A3A'; statusFg = '#8EBDF0'; }
      else if ((z.mode === 'Heat' || z.mode === 'Auto') && z.current < z.set) { status = 'Heating to ' + z.set + '°'; statusBg = '#3A1D17'; statusFg = '#F59A85'; }
      const off = z.mode === 'Off';
      return {
        name: z.name,
        current: z.current,
        humidity: z.humidity,
        status, statusBg, statusFg,
        setLabel: off ? 'System' : 'Set to',
        setText: off ? 'Off' : z.set + '°',
        setColor: off ? '#8C867B' : '#F4EFE6',
        down: () => { if (!off) this.updateZone(i, { set: Math.max(60, z.set - 1) }); },
        up: () => { if (!off) this.updateZone(i, { set: Math.min(85, z.set + 1) }); },
        downLabel: 'Lower ' + z.name + ' temperature',
        upLabel: 'Raise ' + z.name + ' temperature',
        modeGroup: z.name + ' mode',
        fanGroup: z.name + ' fan',
        modes: ['Heat', 'Cool', 'Auto', 'Off'].map((m) => ({ label: m, ...seg(z.mode === m), pick: () => this.updateZone(i, { mode: m }) })),
        fans: ['Auto', 'On'].map((f) => ({ label: f, ...seg(z.fan === f), pick: () => this.updateZone(i, { fan: f }) }))
      };
    });
    const presets = ['Home', 'Away', 'Sleep'].map((p) => {
      const on = s.preset === p;
      return {
        label: p,
        pressed: on ? 'true' : 'false',
        bg: on ? '#E8A33D' : '#26241F',
        fg: on ? '#1B1A17' : '#F4EFE6',
        pick: () => this.setState({ preset: p, zones: s.zones.map((z) => ({ ...z, set: this.presetTemps[p] })) })
      };
    });
    return { zones, presets };
  }
}
</script>
</body>
</html>
