<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen Hub – Doorbell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}a{color:#E8A33D}a:hover{color:#F2C27A}</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 24px; display: flex; gap: 24px; background: #1B1A17; color: #F4EFE6; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

<section aria-label="Doorbell live view" style="flex: 1; min-width: 0; border-radius: 28px; background: #0B0A09; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #3A1D17; color: #F59A85; font-size: 14px; font-weight: 800; letter-spacing: 0.08em"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F07A60"></span>LIVE</span>
<span style="font-size: 15px; font-weight: 600; color: #A8A196">Front door camera</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; color: #6B665C">
<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="m16 10 5-3v10l-5-3z"></path></svg>
<span style="font-size: 18px; font-weight: 600">Nest doorbell live stream</span>
</div>
<div style="display: flex; justify-content: center; gap: 16px">
<button type="button" onClick="{{toggleTalk}}" style="all: unset; cursor: pointer; height: 64px; padding: 0 28px; border-radius: 32px; background: {{talkBg}}; color: {{talkFg}}; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>{{talkLabel}}</button>
</div>
</section>

<aside style="width: 440px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 4px 0">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #E8A33D"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>Doorbell</span>
<span style="font-size: 32px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15">Someone's at the front door</span>
<span style="font-size: 16px; color: #A8A196">Rang at {{rangAt}}</span>
</div>

<div style="background: #26241F; border: 1px solid #2E2B26; border-radius: 22px; padding: 18px 20px; display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: {{lockTint}}; color: {{lockColor}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{unlocked}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg></sc-if>
<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
</span>
<div style="display: flex; flex-direction: column">
<span style="font-size: 24px; font-weight: 800; color: {{lockColor}}">{{lockLabel}}</span>
<span style="font-size: 14px; color: #A8A196">{{lockSub}}</span>
</div>
</div>

<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; background: #26241F; border: 1px solid #2E2B26; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 16px; font-weight: 700">Enter PIN to unlock</span>
<span style="font-size: 14px; font-weight: 700; color: {{msgColor}}">{{msg}}</span>
</div>
<div style="display: flex; justify-content: center; gap: 16px; padding: 2px 0">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 2px solid #6B665C; background: {{d.fill}}"></span></sc-for>
</div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="all: unset; cursor: pointer; border-radius: 16px; background: #312E28; color: #F4EFE6; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; min-height: 56px">{{k.label}}</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{unlocked}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end">
<button type="button" onClick="{{lockNow}}" style="all: unset; cursor: pointer; height: 72px; border-radius: 20px; background: #5FB3A6; color: #12201E; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Lock now</button>
</div>
</sc-if>

<a href="Main.dc.html" style="height: 60px; flex-shrink: 0; border-radius: 18px; background: #312E28; color: #F4EFE6; text-decoration: none; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Dismiss</a>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pin: '', unlocked: false, relock: 30, talking: false, error: false, rangAt: new Date() };
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  press(v) {
    if (this.state.unlocked) return;
    if (v === 'back') { this.setState({ pin: this.state.pin.slice(0, -1), error: false }); return; }
    if (v === 'clear') { this.setState({ pin: '', error: false }); return; }
    const pin = (this.state.pin + v).slice(0, 4);
    if (pin.length < 4) { this.setState({ pin, error: false }); return; }
    if (pin === '1234') {
      this.setState({ pin: '', unlocked: true, relock: 30, error: false });
      clearInterval(this.timer);
      this.timer = setInterval(() => {
        const r = this.state.relock - 1;
        if (r <= 0) { clearInterval(this.timer); this.setState({ unlocked: false, relock: 30 }); }
        else this.setState({ relock: r });
      }, 1000);
    } else {
      this.setState({ pin: '', error: true });
    }
  }
  renderVals() {
    const s = this.state;
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Clear', '0', '⌫'];
    const values = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'];
    const keys = labels.map((label, i) => ({
      label,
      aria: values[i] === 'back' ? 'Delete digit' : values[i] === 'clear' ? 'Clear PIN' : 'Digit ' + label,
      press: () => this.press(values[i])
    }));
    const dots = [0, 1, 2, 3].map((i) => ({ fill: i < s.pin.length ? '#E8A33D' : 'transparent' }));
    const t = s.rangAt;
    let h = t.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return {
      rangAt: h + ':' + String(t.getMinutes()).padStart(2, '0') + ' ' + ap,
      unlocked: s.unlocked,
      locked: !s.unlocked,
      lockLabel: s.unlocked ? 'Unlocked' : 'Locked',
      lockSub: s.unlocked ? 'Relocks automatically in ' + s.relock + 's' : 'Nest x Yale · Battery 82%',
      lockColor: s.unlocked ? '#F59A85' : '#5FB3A6',
      lockTint: s.unlocked ? '#3A1D17' : '#1F3330',
      msg: s.error ? 'Wrong PIN, try again' : 'Demo PIN: 1234',
      msgColor: s.error ? '#F59A85' : '#A8A196',
      dots,
      keys,
      lockNow: () => { clearInterval(this.timer); this.setState({ unlocked: false, relock: 30 }); },
      toggleTalk: () => this.setState({ talking: !s.talking }),
      talkLabel: s.talking ? 'Talking… tap to stop' : 'Talk',
      talkBg: s.talking ? '#E8A33D' : '#312E28',
      talkFg: s.talking ? '#1B1A17' : '#F4EFE6'
    };
  }
}
</script>
</body>
</html>
